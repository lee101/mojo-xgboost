[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-xgboost"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.1.0.dev2026081105"
max = ">=26.5.0.dev2026072406,<27"   # libmax.so: required for the GPU path
python = "3.13.*"
pytest = "*"
numpy = "*"
xgboost = "*"
scikit-learn = "*"
